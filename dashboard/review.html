<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revisão de Perfis — Inteligência de Mercado</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3250;
    --accent: #6c63ff;
    --green: #4caf7d;
    --blue: #42a5f5;
    --red: #ff5252;
    --yellow: #ffc107;
    --text: #e8eaf6;
    --muted: #7b82b0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header h1 { font-size: 16px; font-weight: 700; }
  header .back { color: var(--muted); text-decoration: none; font-size: 13px; }
  header .back:hover { color: var(--text); }
  .header-right { margin-left: auto; display: flex; gap: 12px; align-items: center; }
  .progress-text { color: var(--muted); font-size: 12px; }

  .layout { display: flex; min-height: calc(100vh - 57px); }

  .vendor-sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
  }

  .sidebar-title {
    padding: 12px 16px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }

  .vendor-item {
    padding: 10px 16px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background .12s;
  }
  .vendor-item:hover { background: var(--surface2); }
  .vendor-item.active { background: var(--surface2); border-left: 3px solid var(--accent); }
  .vendor-item.done { opacity: .45; }

  .vendor-item-name { font-size: 13px; font-weight: 500; }
  .vendor-item-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .status-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: middle;
  }
  .dot-pending { background: var(--yellow); }
  .dot-done   { background: var(--green); }

  main {
    flex: 1;
    padding: 28px;
    overflow-y: auto;
  }

  .empty-state {
    color: var(--muted);
    text-align: center;
    padding: 80px 20px;
    font-size: 15px;
  }
  .empty-state p { margin-top: 8px; font-size: 13px; }

  .vendor-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 8px;
  }
  .vendor-header h2 { font-size: 20px; font-weight: 700; }
  .category-badge {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .4px;
    padding: 3px 9px;
    border-radius: 20px;
    background: rgba(108,99,255,.2);
    color: var(--accent);
  }

  .legend {
    display: flex;
    gap: 16px;
    margin-bottom: 20px;
    font-size: 12px;
    color: var(--muted);
    flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot {
    width: 10px; height: 10px; border-radius: 3px;
  }

  .candidates-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }

  .candidate-card {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    position: relative;
    transition: border-color .15s;
  }
  .candidate-card.done-a { border-color: var(--green); opacity: .5; }
  .candidate-card.done-b { border-color: var(--blue); opacity: .5; }
  .candidate-card.done-x { opacity: .3; }

  .confidence-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 12px 12px 0 0;
    background: var(--border);
    overflow: hidden;
  }
  .confidence-fill { height: 100%; background: var(--accent); }
  .high .confidence-fill { background: var(--green); }
  .mid .confidence-fill  { background: var(--yellow); }
  .low .confidence-fill  { background: var(--muted); }

  .card-handle {
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 4px;
    margin-top: 4px;
  }
  .card-name  { font-size: 13px; margin-bottom: 6px; }
  .card-bio   { font-size: 12px; color: var(--muted); margin-bottom: 10px; min-height: 32px; }
  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border);
    padding-top: 8px;
    margin-top: 4px;
    margin-bottom: 10px;
  }
  .card-followers { font-size: 12px; color: var(--muted); }
  .card-link {
    font-size: 11px;
    color: var(--accent);
    text-decoration: none;
    padding: 3px 8px;
    border: 1px solid var(--accent);
    border-radius: 4px;
  }
  .card-link:hover { background: rgba(108,99,255,.15); }

  .card-actions {
    display: flex;
    gap: 6px;
  }

  .btn-sm {
    flex: 1;
    padding: 7px 4px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: opacity .15s, filter .15s;
    text-align: center;
  }
  .btn-sm:hover { filter: brightness(1.15); }
  .btn-sm:disabled { opacity: .35; cursor: default; filter: none; }

  .btn-a { background: var(--green);    color: #fff; }
  .btn-b { background: var(--blue);     color: #fff; }
  .btn-x { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }

  .bottom-actions {
    display: flex;
    gap: 12px;
    align-items: center;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }

  .btn-skip {
    padding: 9px 20px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    cursor: pointer;
  }
  .btn-skip:hover { color: var(--text); border-color: var(--muted); }

  .no-candidates {
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 32px;
    text-align: center;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .toast {
    position: fixed;
    bottom: 24px; right: 24px;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    display: none;
    z-index: 999;
    box-shadow: 0 4px 16px rgba(0,0,0,.4);
    color: #fff;
  }
  .toast.green { background: var(--green); }
  .toast.blue  { background: var(--blue); }
  .toast.red   { background: var(--red); }

  .loading-overlay {
    color: var(--muted);
    padding: 60px;
    text-align: center;
    font-size: 15px;
  }
</style>
</head>
<body>

<header>
  <a class="back" href="/">← Dashboard</a>
  <h1>Revisão de Perfis de Instagram</h1>
  <div class="header-right">
    <span class="progress-text" id="progress-text"></span>
  </div>
</header>

<div class="layout">
  <div class="vendor-sidebar">
    <div class="sidebar-title">Fornecedores pendentes</div>
    <div id="vendor-list"></div>
  </div>

  <main id="main-content">
    <div class="empty-state">
      Selecione um fornecedor ao lado para revisar os candidatos.
      <p>Rode <code>python discover.py</code> primeiro para buscar candidatos.</p>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
let vendors = [];
let currentVendor = null;
let doneSet = new Set();

async function loadVendors() {
  const r = await fetch('/api/review/vendors');
  vendors = await r.json();
  await refreshStats();
  renderSidebar();
  if (vendors.length > 0) selectVendor(vendors[0].vendor_name);
}

async function refreshStats() {
  const stats = await (await fetch('/api/review/stats')).json();
  document.getElementById('progress-text').textContent =
    `${stats.confirmed} confirmados · ${stats.pending} pendentes`;
}

function renderSidebar() {
  const list = document.getElementById('vendor-list');
  if (!vendors.length) {
    list.innerHTML = '<div style="padding:20px;color:var(--muted);font-size:13px">Nenhum pendente.<br>Rode python discover.py primeiro.</div>';
    return;
  }
  list.innerHTML = vendors.map(v => {
    const done = doneSet.has(v.vendor_name);
    const active = currentVendor === v.vendor_name ? ' active' : '';
    const cls = done ? ' done' : '';
    return `<div class="vendor-item${active}${cls}" onclick="selectVendor('${esc(v.vendor_name)}')">
      <div class="vendor-item-name">
        <span class="status-dot ${done ? 'dot-done' : 'dot-pending'}"></span>
        ${v.vendor_name}
      </div>
      <div class="vendor-item-meta">${v.candidate_count} candidato(s) · ${v.vendor_category}</div>
    </div>`;
  }).join('');
}

async function selectVendor(name) {
  currentVendor = name;
  renderSidebar();

  const main = document.getElementById('main-content');
  main.innerHTML = '<div class="loading-overlay">Carregando candidatos…</div>';

  const r = await fetch('/api/review/candidates?vendor=' + encodeURIComponent(name));
  const candidates = await r.json();

  const vendor = vendors.find(v => v.vendor_name === name);
  const catLabel = { planner: 'Cerimonial', decorator: 'Decoração', venue: 'Local',
                     buffet: 'Buffet', competitor: 'Concorrente', photographer: 'Foto/Vídeo' };

  let candidateHTML = '';
  if (!candidates.length) {
    candidateHTML = `<div class="no-candidates">
      Nenhum candidato encontrado para este fornecedor.<br>
      <small>Rode <code>python discover.py --name "${name}"</code> para tentar novamente.</small>
    </div>`;
  } else {
    candidateHTML = `<div class="candidates-grid">` +
      candidates.map(c => {
        const conf = c.confidence || 0.5;
        const tier = conf >= 0.75 ? 'high' : conf >= 0.45 ? 'mid' : 'low';
        const pct = Math.round(conf * 100);
        const followers = c.followers ? `${c.followers} seguidores` : '—';
        const bio = c.bio || '<em style="opacity:.5">bio não disponível</em>';
        const displayName = c.display_name || c.handle;
        const h = esc(c.handle);
        return `<div class="candidate-card ${tier}" id="card-${h}">
          <div class="confidence-bar"><div class="confidence-fill" style="width:${pct}%"></div></div>
          <div class="card-handle">${c.handle}</div>
          <div class="card-name">${displayName}</div>
          <div class="card-bio">${bio}</div>
          <div class="card-footer">
            <span class="card-followers">${followers}</span>
            <a class="card-link" href="${c.profile_url}" target="_blank">Ver perfil →</a>
          </div>
          <div class="card-actions">
            <button class="btn-sm btn-a" onclick="doAction('${h}','confirm_a')" title="Adicionar como conta principal (Tier A)">
              ★ Principal
            </button>
            <button class="btn-sm btn-b" onclick="doAction('${h}','confirm_b')" title="Adicionar como conta secundária (Tier B)">
              ○ Secundário
            </button>
            <button class="btn-sm btn-x" onclick="doAction('${h}','discard')" title="Descartar este candidato">
              ✕
            </button>
          </div>
        </div>`;
      }).join('') +
    `</div>`;
  }

  main.innerHTML = `
    <div class="vendor-header">
      <h2>${name}</h2>
      <span class="category-badge">${catLabel[vendor?.vendor_category] || vendor?.vendor_category || ''}</span>
    </div>
    <div class="legend">
      <span class="legend-item"><span class="legend-dot" style="background:var(--green)"></span> Principal (A) — conta oficial monitorada</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--blue)"></span> Secundário (B) — monitorado com prioridade menor</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--border)"></span> ✕ Descartar — não é este fornecedor</span>
    </div>
    ${candidateHTML}
    <div class="bottom-actions">
      <button class="btn-skip" onclick="skipAll()">Nenhum é correto — pular todos</button>
    </div>
  `;
}

async function doAction(handle, action) {
  if (!currentVendor) return;

  const card = document.getElementById('card-' + handle);
  const btns = card.querySelectorAll('.btn-sm');
  btns.forEach(b => b.disabled = true);

  const r = await fetch('/api/review/action', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ vendor_name: currentVendor, handle, action })
  });

  if (!r.ok) { btns.forEach(b => b.disabled = false); return; }

  if (action === 'confirm_a') {
    card.classList.add('done-a');
    showToast(`★ ${handle} → Principal (A)`, 'green');
    // confirm_a rejects all others — move vendor out of pending list
    doneSet.add(currentVendor);
    vendors = vendors.filter(v => v.vendor_name !== currentVendor);
    renderSidebar();
    await refreshStats();
    if (vendors.length > 0) {
      selectVendor(vendors[0].vendor_name);
    } else {
      document.getElementById('main-content').innerHTML =
        '<div class="empty-state">Todos os fornecedores foram revisados! 🎉<p>Novos candidatos aparecerão aqui após rodar discover.py.</p></div>';
    }
  } else if (action === 'confirm_b') {
    card.classList.add('done-b');
    showToast(`○ ${handle} → Secundário (B)`, 'blue');
    await refreshStats();
    // keep current vendor in list (other candidates still pending)
    // update candidate count displayed
    const vendorItem = vendors.find(v => v.vendor_name === currentVendor);
    if (vendorItem && vendorItem.candidate_count > 1) {
      vendorItem.candidate_count--;
    }
    renderSidebar();
  } else if (action === 'discard') {
    card.classList.add('done-x');
    showToast(`✕ ${handle} descartado`, 'red');
    // check if any pending cards remain
    const allCards = document.querySelectorAll('.candidate-card');
    const anyPending = [...allCards].some(c => !c.classList.contains('done-a') && !c.classList.contains('done-b') && !c.classList.contains('done-x'));
    if (!anyPending) {
      // all dealt with — move on
      doneSet.add(currentVendor);
      vendors = vendors.filter(v => v.vendor_name !== currentVendor);
      renderSidebar();
      if (vendors.length > 0) selectVendor(vendors[0].vendor_name);
    }
  }
}

async function skipAll() {
  if (!currentVendor) return;
  await fetch('/api/review/skip', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ vendor_name: currentVendor })
  });
  showToast(`Pulado: ${currentVendor}`, 'red');
  vendors = vendors.filter(v => v.vendor_name !== currentVendor);
  renderSidebar();
  if (vendors.length > 0) {
    selectVendor(vendors[0].vendor_name);
  } else {
    document.getElementById('main-content').innerHTML =
      '<div class="empty-state">Todos revisados.</div>';
  }
}

function showToast(msg, color = 'green') {
  const t = document.getElementById('toast');
  t.className = `toast ${color}`;
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 2500);
}

function esc(s) {
  return (s || '').replace(/['"<>&]/g, c => ({'\'':'&#39;','"':'&quot;','<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
}

loadVendors();
</script>
</body>
</html>
